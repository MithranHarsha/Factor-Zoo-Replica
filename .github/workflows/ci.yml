name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        # uv sync (not `uv pip install -e`) actually reads uv.lock, which is
        # also what makes astral-sh/setup-uv's cache-dependency-glob
        # (**/uv.lock) resolve to something -- without a committed lockfile
        # that glob matches nothing and the action fails before a single
        # dependency installs. --all-extras: test_dashboard_data.py needs
        # streamlit (dashboard) and test_ipca_model.py needs the ipca
        # package (taming), so a narrower install would pass locally and
        # fail here for a reason that has nothing to do with the code under
        # test.
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Offline tests (leakage tests, schema tests, point-in-time rule)
        # Network-marked tests (live EDGAR/Stooq/Yahoo/French pulls) are
        # excluded by default via pyproject.toml's addopts -- CI should not
        # depend on third-party uptime or rate limits to pass or fail.
        run: uv run pytest -v --cov=factorzoo --cov-report=term-missing
