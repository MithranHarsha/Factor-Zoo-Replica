[project]
name = "factorzoo"
version = "0.1.0"
description = "Free-data, point-in-time-correct replication of the academic cross-sectional factor zoo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.22", "networkx>=3.3"]
taming = ["ipca>=0.1.2"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "black>=24.4"]

[project.scripts]
factorzoo = "factorzoo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorzoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: tests that make real HTTP calls to live data sources (run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
